<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Bulk QR Code Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fdfdfd;
            color: #333;
            margin: 0;
            padding: 20px;
            text-align: center;
            font-size: 1.2em;
        }

        .container {
            max-width: 914px;
            /* Увеличил ещё на 5% (870 * 1.05) */
            margin: 0 auto;
        }

        h1 {
            font-weight: 500;
            margin-bottom: 0.5em;
            /* Ещё уменьшил отступ после заголовка */
            font-size: 2em;
        }

        p {
            line-height: 1.4;
            margin: 0.8em 0;
            font-size: 1.2em;
        }

        img {
            max-width: 100%;
            height: auto;
            /* border: 1px solid #eee; */
            /* Убрал бордер */
            border-radius: 8px;
            margin-top: 0.5em;
            margin-bottom: 1em;
            /* box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); */
            /* Убрал тень */
        }

        .highlight {
            text-decoration: underline;
            text-decoration-color: #ff0000;
            text-decoration-thickness: 1px;
            /* Сделал тоньше */
        }
    </style>
    <script defer src="https://cloud.umami.is/script.js"
        data-website-id="a0a4f7cb-4e97-468c-8c8b-5bcc53d35c10"></script>
</head>

<body>
    <div class="container">
        <h1>Bulk QR Code Generator Installed</h1>
        <p>
            Click the <span class="highlight">puzzle piece (1)</span> in the top right of your browser.
            <br>
            Then, click the <span class="highlight">little pin (2)</span> next to the extension:
        </p>
        <img src="assets/wp-1.png" alt="Step 1: Pin the extension">
        <p>
            <span class="highlight">Open the extension (3)</span> in a new Tab to generate multiple QR Codes
        </p>
        <img src="assets/wp-2.png" alt="Step 2: Open the extension">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: {y: 0.6}
            });
        });
    </script>
</body>

</html>
