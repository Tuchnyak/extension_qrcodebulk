<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk QR Code Generator</title>
    <link rel="stylesheet" href="bulk.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <img src="../icons/icon48.png" alt="Extension icon" class="ext-icon">
            <h1>Bulk QR Code Generator</h1>
        </header>

        <!-- Instructions -->
        <div class="instructions">
            <p>Paste your URLs or CSV data (one per line):</p>
            <p><strong>Example (URL only):</strong> <code>https://google.com</code></p>
            <p><strong>CSV example:</strong> <code>top_text<span class="separator-highlight">;</span>URL<span
                        class="separator-highlight">;</span>bottom_text</code></p>
        </div>

        <!-- CSV Controls -->
        <div class="csv-controls">
            <div class="control-group">
                <button id="upload-csv-btn">Upload CSV</button>
                <input type="file" id="csv-file-input" accept=".csv,.txt" style="display: none;">
            </div>
            <div class="control-group csv-options">
                <label for="separator-input">Separator:</label>
                <input type="text" id="separator-input" value=";" maxlength="1">
            </div>
            <div class="control-group csv-options">
                <label for="top-text-checkbox">Include top text</label>
                <input type="checkbox" id="top-text-checkbox" checked>
            </div>
            <div class="control-group csv-options">
                <label for="bottom-text-checkbox">Include bottom text</label>
                <input type="checkbox" id="bottom-text-checkbox" checked>
            </div>
        </div>

        <!-- Data Input -->
        <div class="data-input">
            <textarea id="data-textarea"
                placeholder="https://google.com&#10;https://example.com&#10;top_text;https://example.com;bottom_text"
                rows="8"></textarea>
        </div>

        <!-- Status Area -->
        <div id="status-area" class="status-area"></div>

        <!-- Generate Button -->
        <div class="generate-section">
            <button id="generate-btn">Generate QR Codes</button>
            <div class="control-group zip-option">
                <input type="checkbox" id="zip-checkbox">
                <label for="zip-checkbox">Save as ZIP archive</label>
            </div>
        </div>

        <!-- Advanced Settings -->
        <div class="advanced-settings">
            <h3>Advanced Settings</h3>
            <div class="control-group">
                <label for="image-size-input">Image Size (px):</label>
                <select id="image-size-input">
                    <option value="64">64</option>
                    <option value="128">128</option>
                    <option value="256">256</option>
                    <option value="512" selected>512</option>
                    <option value="1024">1024</option>
                    <option value="2048">2048</option>
                    <option value="4096">4096</option>
                </select>
            </div>
            <div class="control-group">
                <label for="file-name-input">Custom Filename:</label>
                <input type="text" id="file-name-input" value="qr_code" pattern="[a-zA-Z0-9_-]+">
            </div>
        </div>
    </div>

    <script src="bulk.js" defer></script>
</body>

</html>
